    <script>
      // Aggressively unregister stale Service Workers and purge obsolete CacheStorage in development/localhost
      if ('serviceWorker' in navigator) {
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '8080') {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let reg of registrations) {
              reg.unregister().then(function(unregistered) {
                if (unregistered) {
                  console.log('🔄 Stale Service Worker unregistered for localhost development.');
                }
              });
            }
          });
          if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
              for (let name of cacheNames) {
                caches.delete(name).then(function() {
                  console.log('🧹 Purged obsolete browser cache:', name);
                });
              }
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.log('[SW] ServiceWorker registration skipped/offline:', err);
            });
          });
        }
      }
    </script>
  </body>
